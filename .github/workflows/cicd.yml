name: CI-CD

on:
  pull_request:
    branches: ["main", "development"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Backend Container Lockfile
        run: pnpm --dir backend install --frozen-lockfile --ignore-workspace

      - name: Lint Backend
        run: pnpm --filter backend-ph-healthcare lint

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Test Backend
        run: pnpm test:backend

      - name: Build Backend
        run: pnpm build:backend

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Frontend Container Lockfile
        run: pnpm --dir frontend install --frozen-lockfile --ignore-workspace

      - name: Lint Frontend
        run: pnpm --filter frontend-ph-healthcare lint

      - name: Test Frontend
        run: pnpm test:frontend

      - name: Build Frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.CLIENT_PUBLIC_API_BASE_URL || 'https://medix-backend.onrender.com/api/v1' }}
        run: pnpm build:frontend

  publish-backend-docker:
    name: Push Backend to Docker Hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend-check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/medix-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/medix-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-frontend-docker:
    name: Push Frontend to Docker Hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [frontend-check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.CLIENT_PUBLIC_API_BASE_URL || 'https://medix-backend.onrender.com/api/v1' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/medix-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/medix-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-render:
    name: Trigger Render Redeployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [publish-backend-docker, publish-frontend-docker]

    steps:
      - name: Trigger Render Backend Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" ]; then
            echo "Triggering Render backend deploy hook..."
            curl -f -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
          else
            echo "RENDER_BACKEND_DEPLOY_HOOK secret is not set. Render will use native Git auto-deploy on main branch."
          fi

      - name: Trigger Render Frontend Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" ]; then
            echo "Triggering Render frontend deploy hook..."
            curl -f -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
          else
            echo "RENDER_FRONTEND_DEPLOY_HOOK secret is not set. Render will use native Git auto-deploy on main branch."
          fi
