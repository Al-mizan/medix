services:
  # ==========================================
  # Backend API Service (Express + Prisma + pgvector)
  # ==========================================
  - type: web
    name: medix-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      # Database connection (Prisma Postgres with pgvector)
      - key: DATABASE_URL
        sync: false
      # Redis connection (Upstash Redis)
      - key: REDIS_URL
        sync: false
      # BetterAuth & Session Secrets
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://medix-backend.onrender.com
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 30d
      - key: BETTER_AUTH_SESSION_TOKEN_EXPIRES_IN
        value: 15m
      - key: BETTER_AUTH_SESSION_TOKEN_UPDATE_AGE
        value: 1d
      # CORS & Frontend Origins
      - key: FRONTEND_URL
        value: https://medix-frontend.onrender.com
      # Email Service (SMTP)
      - key: EMAIL_SENDER_SMTP_USER
        sync: false
      - key: EMAIL_SENDER_SMTP_PASS
        sync: false
      - key: EMAIL_SENDER_SMTP_HOST
        sync: false
      - key: EMAIL_SENDER_SMTP_PORT
        sync: false
      - key: EMAIL_SENDER_SMTP_FROM
        sync: false
      # OAuth & Integrations
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://medix-backend.onrender.com/api/v1/auth/google/callback
      # Media & Storage (Cloudinary)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Payment Processing (Stripe)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Initial Admin Credentials for Seeding
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false

  # ==========================================
  # Frontend Application (Next.js 16 Standalone)
  # ==========================================
  - type: web
    name: medix-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile.prod
    dockerContext: ./frontend
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://medix-backend.onrender.com/api/v1
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        fromService:
          name: medix-backend
          type: web
          envVarKey: ACCESS_TOKEN_SECRET
      - key: ACCESS_TOKEN_SECRET
        fromService:
          name: medix-backend
          type: web
          envVarKey: ACCESS_TOKEN_SECRET
